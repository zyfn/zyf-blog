<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code Agent loop</title>
  <desc id="desc">A loop from goal and context through hypothesis, action and evidence to acceptance, constrained by policy and human judgement.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101828" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="#f7f7f5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" text-anchor="middle">
    <g fill="none" stroke="#98a2b3" stroke-width="3" marker-end="url(#arrow)">
      <path d="M218 220H292"/><path d="M438 220H512"/><path d="M658 220H732"/><path d="M878 220H942"/>
      <path d="M1018 274C1018 398 590 408 366 294"/>
    </g>
    <g filter="url(#shadow)">
      <rect x="58" y="162" width="160" height="116" rx="22" fill="#fff" stroke="#deded8"/>
      <rect x="292" y="162" width="146" height="116" rx="22" fill="#fff" stroke="#deded8"/>
      <rect x="512" y="162" width="146" height="116" rx="22" fill="#fff" stroke="#deded8"/>
      <rect x="732" y="162" width="146" height="116" rx="22" fill="#fff" stroke="#deded8"/>
      <path d="M1018 148l76 72-76 72-76-72z" fill="#fff7f3" stroke="#ff6b4a" stroke-width="2"/>
    </g>
    <g fill="#161616" font-size="22" font-weight="650">
      <text x="138" y="208">目标与边界</text><text x="138" y="240" fill="#667085" font-size="18" font-weight="500">Goal</text>
      <text x="365" y="208">收集上下文</text><text x="365" y="240" fill="#667085" font-size="18" font-weight="500">Context</text>
      <text x="585" y="208">形成假设</text><text x="585" y="240" fill="#667085" font-size="18" font-weight="500">Reason</text>
      <text x="805" y="208">行动与证据</text><text x="805" y="240" fill="#667085" font-size="18" font-weight="500">Act · Observe</text>
      <text x="1018" y="213">满足验收？</text><text x="1018" y="244" fill="#ff5a36" font-size="18" font-weight="600">Accept?</text>
    </g>
    <g>
      <rect x="176" y="360" width="350" height="72" rx="18" fill="#eeeef2"/>
      <rect x="674" y="360" width="350" height="72" rx="18" fill="#fff1ec"/>
      <text x="351" y="390" fill="#344054" font-size="19" font-weight="650">Permission · Sandbox · Hook · Policy</text>
      <text x="351" y="415" fill="#667085" font-size="16">约束哪些行动能够发生</text>
      <text x="849" y="390" fill="#344054" font-size="19" font-weight="650">Human judgement</text>
      <text x="849" y="415" fill="#667085" font-size="16">澄清 · 中断 · 接管</text>
    </g>
  </g>
</svg>
