<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex App Server system boundary</title>
  <desc id="desc">A product owns its UI and business state, App Server owns protocol and Codex threads, and the execution side owns models, tools, files and MCP.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#71717a"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10a37f"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="48" y="52" fill="#0d0d0d" font-size="25" font-weight="600">App Server 的系统边界</text>
  <text x="48" y="80" fill="#6e6e80" font-size="14">产品拥有业务事实，App Server 拥有 Agent 执行事实</text>

  <rect x="48" y="112" width="280" height="370" rx="10" fill="none" stroke="#e5e5e5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="440" y="94" width="320" height="406" rx="10" fill="none" stroke="#10a37f" stroke-width="1.5"/>
  <rect x="872" y="112" width="280" height="370" rx="10" fill="none" stroke="#e5e5e5" stroke-width="1.5" stroke-dasharray="5 4"/>

  <path d="M328 205 H440" fill="none" stroke="#10a37f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M440 286 H328" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M760 205 H872" fill="none" stroke="#10a37f" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M872 286 H760" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="354" y="185" width="60" height="22" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="384" y="200" text-anchor="middle" fill="#10a37f" font-size="12">请求</text>
  <rect x="349" y="266" width="70" height="22" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="384" y="281" text-anchor="middle" fill="#6e6e80" font-size="12">事件 / 请求</text>
  <rect x="785" y="185" width="62" height="22" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="816" y="200" text-anchor="middle" fill="#10a37f" font-size="12">行动</text>
  <rect x="781" y="266" width="70" height="22" rx="4" fill="#ffffff" opacity="0.96"/>
  <text x="816" y="281" text-anchor="middle" fill="#6e6e80" font-size="12">结果 / 状态</text>

  <text x="72" y="140" fill="#6e6e80" font-size="13" font-weight="500">你的产品</text>
  <rect x="80" y="166" width="216" height="82" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="188" y="199" text-anchor="middle" fill="#0d0d0d" font-size="17" font-weight="600">UI / Dashboard</text>
  <text x="188" y="222" text-anchor="middle" fill="#6e6e80" font-size="13">呈现消息、Diff 与审批</text>
  <rect x="80" y="294" width="216" height="116" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <rect x="80" y="294" width="4" height="116" rx="2" fill="#1d4ed8"/>
  <text x="188" y="329" text-anchor="middle" fill="#0d0d0d" font-size="17" font-weight="600">业务状态</text>
  <text x="188" y="355" text-anchor="middle" fill="#6e6e80" font-size="13">用户 · Task · 验收</text>
  <text x="188" y="379" text-anchor="middle" fill="#6e6e80" font-size="13">幂等 · 恢复策略</text>

  <text x="464" y="122" fill="#10a37f" font-size="13" font-weight="600">Codex App Server</text>
  <rect x="480" y="150" width="240" height="78" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <rect x="480" y="150" width="4" height="78" rx="2" fill="#10a37f"/>
  <text x="600" y="181" text-anchor="middle" fill="#0d0d0d" font-size="17" font-weight="600">Protocol Layer</text>
  <text x="600" y="204" text-anchor="middle" fill="#6e6e80" font-size="13">JSONL · RPC · Notifications</text>
  <rect x="480" y="260" width="240" height="78" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="600" y="291" text-anchor="middle" fill="#0d0d0d" font-size="17" font-weight="600">Thread Manager</text>
  <text x="600" y="314" text-anchor="middle" fill="#6e6e80" font-size="13">创建 · 恢复 · 分支 · 持久化</text>
  <rect x="480" y="370" width="240" height="92" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="600" y="403" text-anchor="middle" fill="#0d0d0d" font-size="17" font-weight="600">Core Threads</text>
  <text x="600" y="427" text-anchor="middle" fill="#6e6e80" font-size="13">Turn · Item · Event</text>
  <text x="600" y="447" text-anchor="middle" fill="#6e6e80" font-size="13">Harness execution facts</text>

  <text x="896" y="140" fill="#6e6e80" font-size="13" font-weight="500">Codex 执行面</text>
  <rect x="904" y="160" width="216" height="66" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="1012" y="188" text-anchor="middle" fill="#0d0d0d" font-size="16" font-weight="600">Model</text>
  <text x="1012" y="209" text-anchor="middle" fill="#6e6e80" font-size="13">推理与下一步行动</text>
  <rect x="904" y="250" width="216" height="66" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="1012" y="278" text-anchor="middle" fill="#0d0d0d" font-size="16" font-weight="600">Tools · Files · Shell</text>
  <text x="1012" y="299" text-anchor="middle" fill="#6e6e80" font-size="13">真实环境中的执行</text>
  <rect x="904" y="340" width="216" height="82" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
  <text x="1012" y="369" text-anchor="middle" fill="#0d0d0d" font-size="16" font-weight="600">MCP · Skills</text>
  <text x="1012" y="392" text-anchor="middle" fill="#6e6e80" font-size="13">能力扩展</text>

  <line x1="48" y1="542" x2="88" y2="542" stroke="#10a37f" stroke-width="2"/>
  <text x="100" y="547" fill="#6e6e80" font-size="12">主请求 / 行动</text>
  <line x1="230" y1="542" x2="270" y2="542" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="282" y="547" fill="#6e6e80" font-size="12">事件 / 反馈</text>
  <text x="1152" y="574" text-anchor="end" fill="#6e6e80" font-size="12">OpenAI-style system diagram · validated 2026-08-31</text>
</svg>
